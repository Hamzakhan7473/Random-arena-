[project]
name = "random-walk-arena"
version = "0.1.0"
description = "Append-only probabilistic forecast arena."
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.2",
  "numpy>=1.26",
  "scipy>=1.13",
  "arch>=7.2",
  "requests>=2.32",
  "pydantic>=2.7",
  "pyarrow>=15.0",
  "torch>=2.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.2"]
foundation = [
  "chronos-forecasting>=2.0",
  "timesfm[torch]>=2.0",
]

[project.scripts]
arena = "arena.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["arena"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

# CPU wheels on Linux and Windows. macOS CPU wheels live on PyPI, so that
# platform is left unpinned and resolves from the default index.
[tool.uv.sources]
torch = [
  { index = "pytorch-cpu", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
